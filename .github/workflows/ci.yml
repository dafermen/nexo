name: Validaciones de Nexo
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: nexo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Código, documentación y pruebas (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run docs:check
      - run: npm test
  navegador:
    name: Navegador sin servicios externos
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Instalar navegador de pruebas en directorio temporal
        run: |
          npm install --prefix "$RUNNER_TEMP/nexo-qa" --ignore-scripts --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/nexo-qa/node_modules/.bin/playwright" install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/nexo-qa/node_modules/playwright" >> "$GITHUB_ENV"
      - run: node tests/admin-access.e2e.js
      - run: node tests/faq-editor.e2e.js
      - run: node tests/admin.e2e.js
      - run: node tests/settings.e2e.js
      - run: node tests/kiosk-home.e2e.js
      - run: node tests/agenda-voice.e2e.js
      - run: node tests/docs.e2e.js
