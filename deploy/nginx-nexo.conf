# Nexo: sitio dedicado en el VPS existente. Mantener otros virtual hosts.
server {
    listen 80;
    listen [::]:80;
    server_name nexo.metodomogollon.com;
    access_log off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/nexo-acme; }
    location / { return 308 https://nexo.metodomogollon.com$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nexo.metodomogollon.com;
    ssl_certificate /etc/letsencrypt/live/nexo.metodomogollon.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nexo.metodomogollon.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log off;
    client_max_body_size 9m;
    client_header_timeout 10s;
    client_body_timeout 30s;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location / {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Nexo-Proto https;
        proxy_set_header X-Nexo-Client-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 45s;
        proxy_send_timeout 30s;
        proxy_buffering off;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Robots-Tag;
    }
}
